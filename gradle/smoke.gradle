sourceSets {
    portSmoke {
        java.srcDir file("build/validation/${minecraft_version}/${providers.gradleProperty('smokeHost').getOrElse('cml')}-${providers.gradleProperty('smokeSide').getOrElse('client')}-sources")
        resources.srcDir file("build/validation/${minecraft_version}/${providers.gradleProperty('smokeHost').getOrElse('cml')}-${providers.gradleProperty('smokeSide').getOrElse('client')}-resources")
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}
tasks.register('portSmokeJar', Jar) {
    dependsOn tasks.named('portSmokeClasses')
    from sourceSets.portSmoke.output
    archiveFileName = 'addon-port-smoke.jar'
    destinationDirectory = layout.buildDirectory.dir('smoke')
}
tasks.register('stagePortSmoke', Copy) {
    dependsOn 'portSmokeJar'
    from tasks.named('portSmokeJar')
    into file(providers.gradleProperty('game_directory').getOrElse("build/runs/${minecraft_version}") + '/mods')
}
['runClient', 'runServer'].each { name -> tasks.named(name) { dependsOn 'stagePortSmoke' } }

sourceSets.portSmoke.compileClasspath += files("build/${providers.gradleProperty('smokeHost').getOrElse('fs')}-compat/${minecraft_version}/classes-build/classes/java/main")

tasks.named('compilePortSmokeJava') { dependsOn { tasks.findAll { it.name in ['compileFsCompatibility', 'compileBbs2Compatibility'] } } }
