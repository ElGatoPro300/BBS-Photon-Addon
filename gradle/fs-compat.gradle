import groovy.json.JsonSlurper

/* Keep every host's linkage isolated; the canonical sources always target CML. */
def selectedHost = providers.gradleProperty('compatHost').orNull ?: (providers.gradleProperty('fsCompileOnly').isPresent() ? 'fs' : null)
def supported = [:]
['fs', 'bbs2'].each { host ->
    def spec = new JsonSlurper().parse(file("gradle/${host}-hosts.json")).targets[minecraft_version]
    if (spec != null) supported[host] = spec
}
if (selectedHost != null) {
    if (!supported.containsKey(selectedHost)) throw new GradleException("Unsupported host/target: ${selectedHost}/${minecraft_version}")
    layout.buildDirectory = file("build/${selectedHost}-compat/${minecraft_version}/classes-build")
    sourceSets.main.java.setSrcDirs([file("build/${selectedHost}-compat/${minecraft_version}/sources/main/java")])
    sourceSets.main.resources.setSrcDirs([])
    if (sourceSets.findByName('client') != null) {
        sourceSets.client.java.setSrcDirs([file("build/${selectedHost}-compat/${minecraft_version}/sources/client/java")])
        sourceSets.client.resources.setSrcDirs([])
    }
} else {
    supported.each { host, spec ->
        def compileHost = tasks.register(host == 'fs' ? 'compileFsCompatibility' : 'compileBbs2Compatibility', Exec) {
            inputs.files(fileTree('src') { include '**/*.java' }, fileTree('tools') { include '*_fs.py' }, fileTree('gradle'))
            outputs.dir file("build/${host}-compat/${minecraft_version}/classes-build/classes/java")
            environment 'JAVA_HOME', System.getProperty('java.home')
            commandLine 'python', 'tools/build_fs.py', '--mc', minecraft_version, '--host', host
        }
        tasks.named('jar') {
            dependsOn compileHost
            from(file("build/${host}-compat/${minecraft_version}/classes-build/classes/java/main"))
            if (sourceSets.findByName('client') != null) {
                from(file("build/${host}-compat/${minecraft_version}/classes-build/classes/java/client"))
            }
        }
    }
    tasks.named('processResources') {
        inputs.files(file('gradle/fs-hosts.json'), file('gradle/bbs2-hosts.json'))
        doLast {
            def metadata = new File(destinationDir, 'fabric.mod.json')
            def values = new JsonSlurper().parse(metadata)
            values.depends.bbs = supported.isEmpty() ? '>=3.0-beta-7' : ['>=3.0-beta-7'] + supported.values().collect { '=' + it.version }
            if (!supported.containsKey('bbs2')) {
                values.mixins = (values.mixins ?: []).findAll { entry ->
                    !(entry instanceof String ? entry : entry.config).endsWith('.bbs2.mixins.json')
                }
            }
            metadata.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(values)) + '\n'
        }
    }
}
