plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148' apply false
    id 'org.sinytra.adapter.userdev' version '1.2-SNAPSHOT' apply false
}
if (gradle.startParameter.taskNames.any { it.tokenize(':').last() == 'buildAll' }) {
    apply from: 'gradle/build-all.gradle'
    return
}
apply from: 'gradle/minecraft-targets.gradle'
def target = minecraftTarget
def modern = target.namespace == 'official'
apply plugin: 'net.neoforged.moddev'
if (!modern) apply plugin: 'org.sinytra.adapter.userdev'
if (providers.gradleProperty('fsCompileOnly').isPresent()) {
    def hosts = new groovy.json.JsonSlurper().parse(file('gradle/fs-hosts.json'))
    def fs = hosts.targets[minecraft_version]
    if (fs == null) throw new GradleException("No FS host for ${minecraft_version}")
    ext.localCmlJar = file("build/fs-compat/${minecraft_version}/${fs.filename}")
} else {
    apply from: 'gradle/local-cml.gradle'
}
version = project.mod_version + '-' + minecraft_version
group = project.mod_group_id
base { archivesName = 'bbs-photon-addon' }
repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.sinytra.org/' }
    maven { url = uri('repo') }
}
java { toolchain.languageVersion = JavaLanguageVersion.of(target.java) }
sourceSets.main.java.srcDir "src/platform/${target.adapter}/java"
def runFolder = file(providers.gradleProperty('game_directory').getOrElse("build/runs/${minecraft_version}"))
neoForge {
    version = target.neoforge_version
    runs {
        client { client(); gameDirectory = project.file(providers.gradleProperty('game_directory').getOrElse("build/runs/${minecraft_version}")) }
        server { server(); gameDirectory = project.file(providers.gradleProperty('game_directory').getOrElse("build/runs/${minecraft_version}")); programArgument '--nogui' }
    }
}
dependencies {
    if (modern) {
        implementation "org.sinytra:connector:${target.connector_version}"
        implementation "org.sinytra.launchpad:launchpad:${target.launchpad_version}"
    } else {
        additionalRuntimeClasspath "org.sinytra:connector:${target.connector_version}"
        compileOnly 'org.sinytra:forgified-fabric-loader:2.5.68+0.18.4+1.21.1'
    }
    implementation "org.sinytra.forgified-fabric-api:forgified-fabric-api:${target.ffapi_version}"
    implementation "maven.modrinth:ldlib:${target.ldlib2_version}"
    implementation "maven.modrinth:sodium:${target.sodium}"
    implementation "maven.modrinth:iris:${target.iris}"
    implementation "maven.modrinth:photon-editor:${target.photon}"
    implementation "maven.modrinth:kilagraph:${target.kilagraph}"
    compileOnly files(localCmlJar)
}
tasks.register('stageCmlHost', Copy) {
    def fs = new groovy.json.JsonSlurper().parse(file('gradle/fs-hosts.json')).targets[minecraft_version]
    from providers.gradleProperty('smokeHost').getOrElse('cml') == 'fs' ? file("build/fs-compat/${minecraft_version}/${fs.filename}") : localCmlJar
    into new File(runFolder, 'mods')
    rename { providers.gradleProperty('smokeHost').getOrElse('cml') == 'fs' ? fs.filename : 'bbs-cml-host.jar' }
}
tasks.register('stageConnectorAddon', Copy) {
    dependsOn tasks.named('jar')
    from tasks.named('jar')
    into new File(runFolder, 'mods')
    rename { 'bbs-photon-addon.jar' }
}
['runClient', 'runServer'].each { name -> tasks.named(name) { dependsOn 'stageCmlHost', 'stageConnectorAddon' } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = target.java }
processResources {
    def values = [version: project.version, minecraft_version: minecraft_version, java_version: target.java]
    inputs.properties values
    filesMatching('fabric.mod.json') { expand values }
}
publishing { publications { mavenJava(MavenPublication) { from components.java } } }
tasks.register('collectReleaseJar', Copy) { dependsOn tasks.named('jar'); from tasks.named('jar'); into file('build/libs') }
tasks.named('build') { dependsOn 'collectReleaseJar' }

if (providers.gradleProperty('portSmoke').isPresent()) apply from: 'gradle/smoke.gradle'

apply from: 'gradle/fs-compat.gradle'
