plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${project.mod_version}-${project.minecraft_version}"
group = project.mod_group_id

def resolveCmlHostJar = {
    def configuredPath = providers.gradleProperty('bbs_cml_jar').orNull
    return file(configuredPath ?: 'libs/bbs-cml-3.0-beta-2-26.1.jar')
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "Sinytra"
        url = "https://maven.sinytra.org/"
    }
    maven {
        name = "LocalRepo"
        url = uri("repo")
    }
    flatDir {
        dirs 'libs'
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            gameDirectory = file(providers.gradleProperty('game_directory').getOrElse('run'))
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            gameDirectory = file(providers.gradleProperty('game_directory').getOrElse('run'))
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

}

dependencies {
    // Connector & FFAPI (via Sinytra Maven)
    implementation "org.sinytra:connector:${project.connector_version}"
    implementation "org.sinytra.forgified-fabric-api:forgified-fabric-api:${project.ffapi_version}"
    implementation "org.sinytra.launchpad:launchpad:${project.launchpad_version}"

    // Dependencies
    implementation "maven.modrinth:ldlib:${project.ldlib2_version}"
    implementation "maven.modrinth:sodium:mc26.1.2-0.9.2-neoforge"
    implementation "maven.modrinth:iris:1.11.4+26.1-neoforge"
    compileOnly files({ resolveCmlHostJar() })
    implementation "maven.modrinth:photon-editor:mc26.1.x-26.1.2.3-neoforge"
    implementation "maven.modrinth:kilagraph:mc26.1.x-26.1.0.16-neoforge"
    
}

// Connector discovers the unobfuscated CML host JAR from the development mods directory.
def verifyCmlHost = tasks.register('verifyCmlHost') {
    doLast {
        def hostJar = resolveCmlHostJar()
        if (!hostJar.isFile()) {
            throw new GradleException('Build the CML 3.0 Minecraft 26.1.x JAR first, or set -Pbbs_cml_jar=<path>.')
        }
        new java.util.zip.ZipFile(hostJar).withCloseable { archive ->
            def addonApi = archive.getEntry('mchorse/bbs_mod/api/BBSAddonMod.class')
            if (addonApi == null) {
                throw new GradleException('bbs_cml_jar must point to a CML 3.0 distribution JAR, not a sources JAR.')
            }
            archive.getInputStream(addonApi).withCloseable { stream ->
                def header = new DataInputStream(stream)
                header.readInt()
                header.readUnsignedShort()
                if (header.readUnsignedShort() != 69) {
                    throw new GradleException('bbs_cml_jar must target Minecraft 26.1.x / Java 25; older CML builds are incompatible.')
                }
            }
        }
    }
}

def gameDirectory = layout.projectDirectory.dir(providers.gradleProperty('game_directory').getOrElse('run'))

def stageCmlHost = tasks.register('stageCmlHost', Copy) {
    dependsOn(verifyCmlHost)
    from({ resolveCmlHostJar() })
    into(gameDirectory.dir('mods'))
    rename { 'bbs-cml-host.jar' }
}

def stageConnectorAddon = tasks.register('stageConnectorAddon', Copy) {
    from(tasks.named('jar'))
    into(gameDirectory.dir('mods'))
    rename { 'bbs-photon-addon.jar' }
}

tasks.named('runClient').configure { dependsOn(stageCmlHost, stageConnectorAddon) }
tasks.named('runServer').configure { dependsOn(stageCmlHost, stageConnectorAddon) }
tasks.named('compileJava').configure { dependsOn(verifyCmlHost) }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

// Connector discovers BBS entrypoints from Fabric metadata; the runtime remains NeoForge.
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
