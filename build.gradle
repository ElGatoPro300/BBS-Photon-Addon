plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.21'
    id 'org.sinytra.adapter.userdev' version '1.2-SNAPSHOT'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = project.mod_version
group = project.mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "Sinytra"
        url = "https://maven.sinytra.org/"
    }
    // maven {
    //     name = "ParchmentMC"
    //     url = "https://maven.parchmentmc.org"
    // }
    maven {
        name = "LocalRepo"
        url = uri("repo")
    }
    flatDir {
        dirs 'libs'
    }
}

neoForge {
    version = project.neoforge_version

    // parchment {
    //     mappingsVersion = '1.21-2024.06.23-1.21'
    //     minecraftVersion = '1.21'
    // }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Connector & FFAPI (via Sinytra Maven)
    additionalRuntimeClasspath "org.sinytra:connector:${project.connector_version}"
    implementation "org.sinytra.forgified-fabric-api:forgified-fabric-api:${project.ffapi_version}"

    // Dependencies
    implementation "maven.modrinth:ldlib:${project.ldlib2_version}"
	implementation "maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge"
	implementation "maven.modrinth:iris:1.8.12+1.21.1-neoforge"
	implementation "maven.modrinth:watermedia:2.1.37"
    
    // Local jars
    implementation name: 'photon'
    implementation name: 'bbs-cml-edition' // Fabric mod, loaded via Connector
    
    // Additional Fabric deps if needed by BBS/Addon (loaded via FFAPI/Connector)
    // implementation "maven.modrinth:sodium:mc1.21.1-0.6.13-fabric" // Optional
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// Ensure fabric.mod.json and neoforge.mods.toml are included and expanded
processResources {
    inputs.property "version", project.version
    filesMatching(["fabric.mod.json", "META-INF/neoforge.mods.toml"]) {
        expand "version": project.version,
               "file": [jarVersion: project.version]
    }
}
