pluginManagement {
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'net.neoforged.moddev') {
                def selected = providers.gradleProperty('mc').getOrElse('1.21.1')
                useVersion(selected.startsWith('26.') ? '2.0.148' : '1.0.21')
            }
        }
    }
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'NeoForge'
			url = 'https://maven.neoforged.net/releases'
		}
		maven {
			name = "Sinytra"
			url = "https://maven.sinytra.org/"
		}
		maven {
			name = "Su5ed"
			url = "https://maven.su5ed.dev/releases"
		}
		maven {
			name = "Su5edSnapshots"
			url = "https://maven.su5ed.dev/snapshots"
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = "bbs-photon-addon"
